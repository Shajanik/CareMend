<svg width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Setu Bandhasana (Bridge Pose) Animation -->
  <defs>
    <style>
      .figure { fill: #7C3AED; stroke: #5B21B6; stroke-width: 2; }
      .bridge { animation: bridge 3s ease-in-out infinite; }
      @keyframes bridge {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
    </style>
  </defs>
  
  <!-- Ground line -->
  <line x1="30" y1="220" x2="170" y2="220" stroke="#8B5CF6" stroke-width="3"/>
  
  <!-- Figure in Setu Bandhasana -->
  <g class="bridge">
    <!-- Head (on ground) -->
    <circle cx="100" cy="180" r="12" class="figure"/>
    
    <!-- Shoulders (on ground) -->
    <rect x="85" y="185" width="30" height="10" rx="5" class="figure"/>
    
    <!-- Torso (arched up) -->
    <path d="M 85 195 Q 100 160 115 195 L 115 205 Q 100 170 85 205 Z" class="figure"/>
    
    <!-- Arms (alongside body) -->
    <rect x="70" y="190" width="8" height="25" rx="4" class="figure"/>
    <rect x="122" y="190" width="8" height="25" rx="4" class="figure"/>
    
    <!-- Thighs (angled up) -->
    <rect x="85" y="175" width="12" height="25" rx="6" class="figure" transform="rotate(-30 91 187)"/>
    <rect x="103" y="175" width="12" height="25" rx="6" class="figure" transform="rotate(30 109 187)"/>
    
    <!-- Shins (vertical) -->
    <rect x="75" y="195" width="10" height="20" rx="5" class="figure"/>
    <rect x="115" y="195" width="10" height="20" rx="5" class="figure"/>
    
    <!-- Feet (flat on ground) -->
    <ellipse cx="80" cy="220" rx="8" ry="4" class="figure"/>
    <ellipse cx="120" cy="220" rx="8" ry="4" class="figure"/>
  </g>
  
  <!-- Hip lift indicator -->
  <path d="M 90 200 Q 100 185 110 200" stroke="#10B981" stroke-width="2" fill="none" stroke-dasharray="3,3">
    <animate attributeName="stroke-dashoffset" values="0;6" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="100" y="175" text-anchor="middle" font-family="Arial" font-size="10" fill="#10B981">Lift</text>
  
  <!-- Instructions -->
  <text x="100" y="250" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">
    Lie on back, knees bent
  </text>
  <text x="100" y="265" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">
    Press feet down, lift hips up
  </text>
  <text x="100" y="280" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">
    Create bridge with body
  </text>
</svg>