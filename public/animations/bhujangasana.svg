<svg width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Bhujangasana (Cobra Pose) Animation -->
  <defs>
    <style>
      .figure { fill: #DC2626; stroke: #991B1B; stroke-width: 2; }
      .chest { animation: lift 3s ease-in-out infinite; }
      @keyframes lift {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
    </style>
  </defs>
  
  <!-- Ground line -->
  <line x1="30" y1="200" x2="170" y2="200" stroke="#8B5CF6" stroke-width="3"/>
  
  <!-- Figure in Bhujangasana -->
  <g class="chest">
    <!-- Head (lifted) -->
    <circle cx="100" cy="120" r="15" class="figure"/>
    
    <!-- Torso (arched) -->
    <path d="M 85 135 Q 100 125 115 135 L 115 160 Q 100 170 85 160 Z" class="figure"/>
    
    <!-- Arms (supporting) -->
    <rect x="70" y="150" width="10" height="30" rx="5" class="figure" transform="rotate(-20 75 165)"/>
    <rect x="120" y="150" width="10" height="30" rx="5" class="figure" transform="rotate(20 125 165)"/>
    
    <!-- Hands on ground -->
    <ellipse cx="68" cy="185" rx="6" ry="4" class="figure"/>
    <ellipse cx="132" cy="185" rx="6" ry="4" class="figure"/>
    
    <!-- Lower body (on ground) -->
    <rect x="85" y="160" width="30" height="15" rx="7" class="figure"/>
    
    <!-- Legs (flat on ground) -->
    <rect x="85" y="175" width="12" height="20" rx="6" class="figure"/>
    <rect x="103" y="175" width="12" height="20" rx="6" class="figure"/>
  </g>
  
  <!-- Chest opening indicator -->
  <path d="M 85 140 Q 100 130 115 140" stroke="#10B981" stroke-width="2" fill="none" stroke-dasharray="3,3">
    <animate attributeName="stroke-dashoffset" values="0;6" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Instructions -->
  <text x="100" y="230" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">
    Lie face down, palms under shoulders
  </text>
  <text x="100" y="245" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">
    Press palms, lift chest gently
  </text>
  <text x="100" y="260" text-anchor="middle" font-family="Arial" font-size="12" fill="#374151">
    Keep hips on ground
  </text>
</svg>